<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QB-Inventory - NoPixel 4.0 Style</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="inventory-container" class="hidden">
        <!-- 3D Background Effect -->
        <div class="background-3d">
            <div class="grid-floor"></div>
            <div class="ambient-particles"></div>
        </div>

        <!-- Main Inventory Panel -->
        <div class="inventory-wrapper">
            <!-- Player Info Header -->
            <div class="player-header">
                <div class="player-avatar">
                    <i class="fas fa-user"></i>
                </div>
                <div class="player-info">
                    <span class="player-name" id="player-name">Player Name</span>
                    <div class="player-money">
                        <span class="cash"><i class="fas fa-dollar-sign"></i> <span id="player-cash">0</span></span>
                        <span class="bank"><i class="fas fa-university"></i> <span id="player-bank">0</span></span>
                    </div>
                </div>
                <button class="close-btn" onclick="closeInventory()">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <!-- Inventory Panels Container -->
            <div class="inventory-panels">
                <!-- Player Inventory -->
                <div class="inventory-panel player-inventory">
                    <div class="panel-header">
                        <div class="panel-title">
                            <i class="fas fa-briefcase"></i>
                            <span>INVENTORY</span>
                        </div>
                        <div class="panel-info">
                            <div class="weight-bar">
                                <div class="weight-fill" id="player-weight-fill"></div>
                                <span class="weight-text"><span id="player-weight">0</span> / <span id="player-max-weight">120</span> kg</span>
                            </div>
                        </div>
                    </div>
                    <div class="search-bar">
                        <i class="fas fa-search"></i>
                        <input type="text" id="player-search" placeholder="Search items...">
                    </div>
                    <div class="inventory-grid" id="player-inventory-grid">
                        <!-- Slots generated by JS -->
                    </div>
                </div>

                <!-- Hotbar -->
                <div class="hotbar-panel">
                    <div class="hotbar-title">QUICK ACCESS</div>
                    <div class="hotbar-slots" id="hotbar-slots">
                        <!-- Hotbar slots generated by JS -->
                    </div>
                </div>

                <!-- Other Inventory (Trunk, Stash, Shop, etc.) -->
                <div class="inventory-panel other-inventory hidden" id="other-inventory-panel">
                    <div class="panel-header">
                        <div class="panel-title">
                            <i class="fas fa-box" id="other-icon"></i>
                            <span id="other-title">STORAGE</span>
                        </div>
                        <div class="panel-info">
                            <div class="weight-bar">
                                <div class="weight-fill" id="other-weight-fill"></div>
                                <span class="weight-text"><span id="other-weight">0</span> / <span id="other-max-weight">100</span> kg</span>
                            </div>
                        </div>
                    </div>
                    <div class="search-bar">
                        <i class="fas fa-search"></i>
                        <input type="text" id="other-search" placeholder="Search items...">
                    </div>
                    <div class="inventory-grid" id="other-inventory-grid">
                        <!-- Slots generated by JS -->
                    </div>
                </div>
            </div>

            <!-- Ground/Drop Area -->
            <div class="ground-panel">
                <div class="ground-title">
                    <i class="fas fa-arrow-down"></i>
                    <span>DROP ZONE</span>
                </div>
                <div class="ground-drop-area" id="ground-drop-area">
                    <span class="drop-hint">Drag items here to drop</span>
                </div>
            </div>
        </div>

        <!-- Item Context Menu -->
        <div class="context-menu hidden" id="context-menu">
            <div class="context-item" data-action="use">
                <i class="fas fa-hand-pointer"></i>
                <span>Use</span>
            </div>
            <div class="context-item" data-action="give">
                <i class="fas fa-hands-helping"></i>
                <span>Give</span>
            </div>
            <div class="context-item" data-action="drop">
                <i class="fas fa-arrow-down"></i>
                <span>Drop</span>
            </div>
            <div class="context-item" data-action="split">
                <i class="fas fa-cut"></i>
                <span>Split</span>
            </div>
        </div>

        <!-- Amount Input Modal -->
        <div class="modal hidden" id="amount-modal">
            <div class="modal-content">
                <div class="modal-header">
                    <span class="modal-title">Enter Amount</span>
                    <button class="modal-close" onclick="closeModal()">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="item-preview" id="modal-item-preview">
                        <img src="" alt="" id="modal-item-image">
                        <span id="modal-item-name">Item Name</span>
                    </div>
                    <div class="amount-input-wrapper">
                        <button class="amount-btn minus" onclick="adjustAmount(-1)">
                            <i class="fas fa-minus"></i>
                        </button>
                        <input type="number" id="amount-input" value="1" min="1">
                        <button class="amount-btn plus" onclick="adjustAmount(1)">
                            <i class="fas fa-plus"></i>
                        </button>
                    </div>
                    <input type="range" id="amount-slider" min="1" max="100" value="1">
                </div>
                <div class="modal-footer">
                    <button class="btn btn-cancel" onclick="closeModal()">Cancel</button>
                    <button class="btn btn-confirm" onclick="confirmAction()">Confirm</button>
                </div>
            </div>
        </div>

        <!-- Item Tooltip -->
        <div class="item-tooltip hidden" id="item-tooltip">
            <div class="tooltip-header">
                <span class="tooltip-name">Item Name</span>
                <span class="tooltip-rarity">Common</span>
            </div>
            <div class="tooltip-description">Item description goes here...</div>
            <div class="tooltip-stats">
                <div class="stat"><i class="fas fa-weight-hanging"></i> <span class="stat-value">0.5 kg</span></div>
                <div class="stat"><i class="fas fa-layer-group"></i> <span class="stat-value">x1</span></div>
            </div>
            <div class="tooltip-footer">
                <span class="tooltip-hint">Right-click for options</span>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
